<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latihan Garisan Surah Al-Ma'un</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23bbf7d0' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            /* Mengelakkan scroll masa dragging kat phone */
            overscroll-behavior-y: contain; 
        }
        
        .arabic-text {
            font-family: 'Amiri', serif;
            direction: rtl;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-error {
            animation: shake 0.5s ease-in-out;
            border-color: #ef4444 !important; /* Red */
            background-color: #fef2f2 !important;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-success {
            animation: pop 0.4s ease-in-out;
            border-color: #22c55e !important; /* Green */
            background-color: #f0fdf4 !important;
        }

        /* Styling node (titik sambungan) */
        .node {
            transition: transform 0.2s;
            touch-action: none; /* Penting untuk touch events */
        }
        .node:hover {
            transform: scale(1.2);
        }
        .node.active {
            transform: scale(1.3);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
        }

        /* Garisan SVG */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Supaya tak kacau klik */
            z-index: 10;
        }
        line {
            stroke-width: 4px;
            stroke-linecap: round;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));
            transition: stroke 0.3s;
        }
        .line-temp {
            stroke: #94a3b8; /* Slate 400 */
            stroke-dasharray: 8, 8;
        }
        .line-correct {
            stroke: #10b981; /* Emerald 500 */
        }
        
        /* Container bagi kad */
        .card-item {
            z-index: 20; /* Lebih tinggi dari SVG */
        }
    </style>
</head>
<body class="min-h-screen p-2 md:p-8 text-slate-800 flex flex-col items-center">

    <div class="w-full max-w-6xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-emerald-300">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-400 to-teal-500 p-4 md:p-6 text-center text-white relative z-30">
            <h1 class="text-2xl md:text-4xl font-extrabold mb-2 drop-shadow-md">Padankan Ayat & Maksud</h1>
            <p class="text-sm md:text-lg font-semibold bg-white/20 inline-block px-4 py-1 rounded-full shadow-sm">Tarik garisan dari hujung ayat Arab ke jawapan yang betul!</p>
            
            <div class="mt-4 inline-flex items-center gap-2 bg-white text-teal-600 font-bold px-6 py-2 rounded-full shadow-md text-lg border-2 border-teal-200">
                <span>Markah:</span>
                <span id="score-display">0</span> / 7
            </div>
        </div>

        <!-- Ruang Permainan (Game Board) -->
        <div class="relative p-6 md:p-10 bg-slate-50 min-h-[600px]" id="game-board">
            
            <!-- Canvas/SVG untuk garisan -->
            <svg id="lines-svg"></svg>

            <div class="grid grid-cols-2 gap-8 md:gap-24 relative z-20">
                
                <!-- Lajur Kiri: Ayat Arab -->
                <div class="flex flex-col gap-6" id="col-arab">
                    <!-- Dimuatkan melalui JS -->
                </div>

                <!-- Lajur Kanan: Maksud & Gambar -->
                <div class="flex flex-col gap-6" id="col-maksud">
                    <!-- Dimuatkan melalui JS -->
                </div>

            </div>
        </div>
        
    </div>

    <div id="win-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-slate-900/70 backdrop-blur-sm transition-opacity opacity-0 duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-[90%] text-center border-4 border-yellow-400 transform scale-95 transition-transform duration-300">
            <div class="text-6xl mb-4 animate-bounce">🎉🏆🌟</div>
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Hebat!</h2>
            <p class="text-lg text-slate-600 mb-6 font-semibold">Awak berjaya melengkapkan kesemua garisan Surah Al-Ma'un dengan betul!</p>
            <button onclick="resetGame()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold py-3 px-8 rounded-full hover:shadow-lg hover:scale-105 transition-all w-full text-lg shadow-md">
                Main Semula 🔄
            </button>
        </div>
    </div>

    <script>
        const surahData = [
            { id: 1, arabic: "أَرَءَيْتَ ٱلَّذِى يُكَذِّبُ بِٱلدِّينِ ﴿١﴾", meaning: "Tahukah engkau orang yang mendustakan agama?", icon: "🙅‍♂️📜" },
            { id: 2, arabic: "فَذَٰلِكَ ٱلَّذِى يَدُعُّ ٱلْيَتِيمَ ﴿٢﴾", meaning: "Itulah orang yang mengherdik anak yatim.", icon: "😠👊👦" },
            { id: 3, arabic: "وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ ﴿٣﴾", meaning: "Dan tidak menggalakkan memberi makan kepada orang miskin.", icon: "🚫🍽️" },
            { id: 4, arabic: "فَوَيْلٌ لِّلْمُصَلِّينَ ﴿٤﴾", meaning: "Maka celakalah bagi orang yang solat.", icon: "⚠️🧎" },
            { id: 5, arabic: "ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ ﴿٥﴾", meaning: "(Iaitu) orang yang lalai terhadap solatnya.", icon: "⏰😴" },
            { id: 6, arabic: "ٱلَّذِينَ هُمْ يُرَآءُونَ ﴿٦﴾", meaning: "Orang yang riak.", icon: "👀✨" },
            { id: 7, arabic: "وَيَمْنَعُونَ ٱلْمَاعُونَ ﴿٧﴾", meaning: "Dan mereka enggan menolong dengan barang yang bermanfaat.", icon: "🤲🚫" }
        ];

        let score = 0;
        let matchedPairs = []; 
        let currentLines = []; // Menyimpan data garisan kekal {id, lineElement}
        
        // Pembolehubah Dragging
        let isDragging = false;
        let startNodeInfo = null; // Menyimpan id dan koordinat asal
        let tempLine = null; // Garisan SVG sementara
        
        // Elemen DOM
        const gameBoard = document.getElementById('game-board');
        const svgContainer = document.getElementById('lines-svg');
        const colArab = document.getElementById('col-arab');
        const colMaksud = document.getElementById('col-maksud');

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            score = 0;
            matchedPairs = [];
            currentLines = [];
            svgContainer.innerHTML = '';
            colArab.innerHTML = '';
            colMaksud.innerHTML = '';
            document.getElementById('score-display').textContent = score;

            document.getElementById('win-modal').classList.add('hidden', 'opacity-0');
            
            const arabList = shuffleArray([...surahData]);
            const maksudList = shuffleArray([...surahData]);

            // Render Arab (Kiri)
            arabList.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-item relative bg-white rounded-2xl shadow-sm border-2 border-slate-200 p-4 flex items-center justify-between transition-colors min-h-[80px]';
                wrapper.id = `card-arab-${item.id}`;
                
                const text = document.createElement('span');
                text.className = 'arabic-text text-xl md:text-3xl font-bold text-slate-800 w-full pr-4 text-right leading-loose';
                text.textContent = item.arabic;
                
                const node = document.createElement('div');
                // Kedudukan nod (titik) di hujung kanan kotak
                node.className = 'node start-node absolute -right-3 md:-right-5 w-6 h-6 md:w-8 md:h-8 rounded-full bg-emerald-400 border-4 border-white shadow-md cursor-pointer z-30';
                node.dataset.id = item.id;
                
                wrapper.appendChild(text);
                wrapper.appendChild(node);
                colArab.appendChild(wrapper);
                
                // Tambah event listener untuk nod Mula
                node.addEventListener('mousedown', startDrag);
                node.addEventListener('touchstart', startDrag, {passive: false});
            });

            // Render Maksud (Kanan)
            maksudList.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-item relative bg-white rounded-2xl shadow-sm border-2 border-slate-200 p-4 flex items-center gap-4 transition-colors min-h-[80px]';
                wrapper.id = `card-maksud-${item.id}`;
                
                const node = document.createElement('div');
                // Kedudukan nod (titik) di hujung kiri kotak
                node.className = 'node end-node absolute -left-3 md:-left-5 w-6 h-6 md:w-8 md:h-8 rounded-full bg-sky-400 border-4 border-white shadow-md z-30';
                node.dataset.id = item.id;
                
                const icon = document.createElement('div');
                icon.className = 'text-3xl md:text-4xl bg-slate-50 p-2 rounded-xl hidden md:block';
                icon.textContent = item.icon;
                
                const meaning = document.createElement('div');
                meaning.className = 'text-xs md:text-base font-bold text-slate-700 leading-tight w-full ml-4 md:ml-0 pl-2 md:pl-0';
                meaning.textContent = item.meaning;

                wrapper.appendChild(node);
                wrapper.appendChild(icon);
                wrapper.appendChild(meaning);
                colMaksud.appendChild(wrapper);
            });
        }

        // Dapatkan koordinat X,Y nod secara relatif kepada game-board
        function getNodeCenter(element) {
            const boardRect = gameBoard.getBoundingClientRect();
            const elRect = element.getBoundingClientRect();
            return {
                x: elRect.left - boardRect.left + (elRect.width / 2),
                y: elRect.top - boardRect.top + (elRect.height / 2)
            };
        }

        // Cipta garisan SVG
        function createLine(x1, y1, x2, y2, className) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('class', className);
            svgContainer.appendChild(line);
            return line;
        }

        function startDrag(e) {
            // Jangan halang event touchstart lalai secara rawak melainkan untuk nod ini
            e.preventDefault(); 
            
            const node = e.target;
            const id = parseInt(node.dataset.id);
            
            // Halang daripada tarik semula jika dah dipadankan
            if (matchedPairs.includes(id)) return;

            isDragging = true;
            node.classList.add('active');
            
            const center = getNodeCenter(node);
            startNodeInfo = { id, node, x: center.x, y: center.y };
            
            // Cipta garisan sementara (mengekori cursor)
            tempLine = createLine(center.x, center.y, center.x, center.y, 'line-temp');
        }

        function drag(e) {
            if (!isDragging || !tempLine) return;
            e.preventDefault(); // Halang scroll pada telefon ketika menarik garisan

            const boardRect = gameBoard.getBoundingClientRect();
            
            // Sokongan untuk mouse & touch
            let clientX, clientY;
            if (e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Kemaskini posisi hujung garisan sementara
            const x = clientX - boardRect.left;
            const y = clientY - boardRect.top;
            
            tempLine.setAttribute('x2', x);
            tempLine.setAttribute('y2', y);
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            
            startNodeInfo.node.classList.remove('active');

            // Dapatkan koodinat drop (mouse / touch)
            let clientX, clientY;
            if (e.type.includes('touch')) {
                clientX = e.changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // Dapatkan elemen di bawah lokasi kita lepas jari/mouse
            // Perlu disembunyikan gameBoard (atau SVG) dari mengganggu (pointer-events: none pd SVG)
            const droppedElement = document.elementFromPoint(clientX, clientY);
            
            // Semak adakah ia drop di atas nod jawapan (end-node)
            let targetNode = droppedElement;
            if(droppedElement && !droppedElement.classList.contains('end-node')) {
                // Cuba semak parent if users accidently click slightly outside nod tapi dalam wrapper
                targetNode = droppedElement.closest('.end-node');
            }

            // Buang garisan sementara
            if (tempLine) {
                tempLine.remove();
                tempLine = null;
            }

            if (targetNode) {
                const targetId = parseInt(targetNode.dataset.id);
                
                if (targetId === startNodeInfo.id && !matchedPairs.includes(targetId)) {
                    // JAWAPAN BETUL
                    handleCorrectMatch(startNodeInfo.id, startNodeInfo.node, targetNode);
                } else if (targetId !== startNodeInfo.id) {
                    // JAWAPAN SALAH
                    handleWrongMatch(startNodeInfo.id, targetNode.dataset.id);
                }
            }
            
            startNodeInfo = null;
        }

        function handleCorrectMatch(id, startNode, endNode) {
            matchedPairs.push(id);
            score++;
            document.getElementById('score-display').textContent = score;

            // Dapatkan koodinat pusat untuk letak garisan kekal
            const startCenter = getNodeCenter(startNode);
            const endCenter = getNodeCenter(endNode);
            
            const permLine = createLine(startCenter.x, startCenter.y, endCenter.x, endCenter.y, 'line-correct');
            currentLines.push({ id, startNode, endNode, lineElement: permLine });

            // Penggayaan berjaya
            const arabCard = document.getElementById(`card-arab-${id}`);
            const maksudCard = document.getElementById(`card-maksud-${id}`);
            
            [arabCard, maksudCard].forEach(card => {
                card.classList.add('animate-success');
                // Gelapkan sedikit nod tu
                const nodeChild = card.querySelector('.node');
                nodeChild.style.backgroundColor = '#10b981'; // emerald-500
                nodeChild.style.cursor = 'default';
            });

            // Semak jika tamat
            if (score === surahData.length) {
                setTimeout(() => {
                    const winModal = document.getElementById('win-modal');
                    winModal.classList.remove('hidden');
                    setTimeout(() => {
                        winModal.classList.remove('opacity-0');
                        winModal.firstElementChild.classList.remove('scale-95');
                        winModal.firstElementChild.classList.add('scale-100');
                    }, 10);
                }, 800);
            }
        }

        function handleWrongMatch(startId, targetId) {
            // Penggayaan salah (bergegar merah)
            const targetCard = document.getElementById(`card-maksud-${targetId}`);
            
            if (targetCard) {
                targetCard.classList.add('animate-error');
                
                // Reset selepas animasi
                setTimeout(() => {
                    targetCard.classList.remove('animate-error');
                }, 500);
            }
        }

        function resetGame() {
            initGame();
        }

        // Event Listeners Global untuk dragging
        // Kita letakkan pada window/document untuk menangkap pergerakan walaupun laju
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: false});
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // Resize Event: Kemaskini kedudukan garisan jika skrin berubah saiz (c.t.h orientasi telefon)
        window.addEventListener('resize', () => {
            currentLines.forEach(item => {
                const startCenter = getNodeCenter(item.startNode);
                const endCenter = getNodeCenter(item.endNode);
                item.lineElement.setAttribute('x1', startCenter.x);
                item.lineElement.setAttribute('y1', startCenter.y);
                item.lineElement.setAttribute('x2', endCenter.x);
                item.lineElement.setAttribute('y2', endCenter.y);
            });
        });

        // Mula pada muatan awal
        window.onload = initGame;
    </script>
</body>
</html>
