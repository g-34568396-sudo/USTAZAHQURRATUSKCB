<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bouncy Ball: Kuiz Batal Puasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scroll on mobile */
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            pointer-events: none;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 5;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #333;
            user-select: none;
            -webkit-user-select: none;
        }
        .control-btn:active {
            background: rgba(200, 200, 200, 0.9);
        }
        .controls-left { display: flex; gap: 15px; }
        .controls-right { display: flex; }
    </style>
</head>
<body>

    <!-- UI Layer (Score & Name) -->
    <div id="ui-layer" class="hidden text-white font-bold text-xl md:text-2xl font-sans">
        <div id="player-name-display" class="bg-blue-600/80 px-4 py-2 rounded-lg border-2 border-white shadow-lg">
            Murid: <span id="ui-name"></span>
        </div>
        <div id="score-display" class="bg-yellow-500/90 text-yellow-50 px-4 py-2 rounded-lg border-2 border-white shadow-lg flex items-center gap-2">
            <i class="fas fa-star text-yellow-200"></i> <span id="ui-score">0</span> / 7
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="controls" class="hidden md:hidden">
        <div class="controls-left">
            <div class="control-btn shadow-lg" id="btn-right"><i class="fas fa-arrow-right"></i></div>
        </div>
        <div class="controls-right">
            <div class="control-btn shadow-lg" id="btn-jump"><i class="fas fa-arrow-up"></i></div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-md w-[90%] border-4 border-green-500">
            <h1 class="text-3xl font-extrabold text-blue-600 mb-4 tracking-tight">Kuiz Batal Puasa</h1>
            <div class="w-24 h-24 bg-red-500 rounded-full mx-auto mb-4 shadow-inner" style="background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b);"></div>
            <p class="text-gray-600 mb-6 font-medium">Bantu bola merah melanggar perkara yang <b class="text-red-500">MEMBATALKAN PUASA</b> untuk mengumpul 7 bintang. Jauhi perkara yang tidak membatalkan puasa!</p>
            
            <input type="text" id="player-name" placeholder="Masukkan Nama Anda..." class="w-full p-3 border-2 border-gray-300 rounded-xl mb-4 text-lg focus:outline-none focus:border-blue-500 text-center font-bold text-gray-700">
            
            <button id="start-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-xl transition transform hover:scale-105 shadow-lg active:scale-95">
                Mula Bermain! <i class="fas fa-play ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Game Over / Victory Screen -->
    <div id="end-screen" class="overlay hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-md w-[90%] border-4 border-yellow-500">
            <h1 id="end-title" class="text-4xl font-extrabold text-green-500 mb-2">Tahniah!</h1>
            <p id="end-message" class="text-gray-700 text-lg mb-6 font-medium">Anda berjaya menjawab dengan betul.</p>
            
            <div class="flex justify-center items-center gap-2 text-4xl mb-6">
                <i class="fas fa-star text-yellow-400"></i>
                <span id="final-score" class="font-bold text-yellow-500">7/7</span>
            </div>

            <button id="restart-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl text-lg transition transform hover:scale-105 shadow-lg">
                Main Semula <i class="fas fa-redo ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

<script>
    // --- Audio System (Web Audio API Synthesizer) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playJumpSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playMoveSound() {
        if (!audioCtx) return;
        // Very subtle tick sound for moving
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playCorrectSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.type = 'square';
        // Arpeggio
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
        osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1); // C#5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); // E5
        
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function playWrongSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3); 
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }


    // --- Game Engine Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameState = 'START'; // START, PLAYING, END
    let score = 0;
    let playerName = '';
    let cameraX = 0;
    let lastTime = 0;

    // Resize Canvas
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Input Handling
    const keys = { right: false, up: false };
    
    window.addEventListener('keydown', (e) => {
        if(e.code === 'ArrowRight') keys.right = true;
        if(e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
    });
    
    window.addEventListener('keyup', (e) => {
        if(e.code === 'ArrowRight') keys.right = false;
        if(e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
    });

    // Touch Controls
    function setupTouchControl(id, key) {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
        btn.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
        btn.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
    }
    setupTouchControl('btn-right', 'right');
    setupTouchControl('btn-jump', 'up');

    // --- Game Objects ---
    const player = {
        x: 200,
        y: 0,
        radius: 35, // Besarkan sikit supaya nampak macam gambar
        vx: 0,
        vy: 0,
        speed: 450, // Laju sikit
        jumpForce: -1000, // Lompatan lebih tinggi
        gravity: 2800, // Graviti lebih kuat untuk rasa "bouncy"
        grounded: false,
        moveTimer: 0
    };

    // The World
    const levelWidth = 8000;
    let items = [];
    let groundY = 0; // Akan di set dalam resize

    // Content based on user request (7 Valid Batal, 3 Invalid)
    const itemData = [
        { emoji: '🍔', text: 'Makan/Minum Sengaja', isBatal: true },
        { emoji: '🤮', text: 'Muntah Sengaja', isBatal: true },
        { emoji: '🩸', text: 'Haid & Nifas', isBatal: true },
        { emoji: '💫', text: 'Gila / Pitam', isBatal: true },
        { emoji: '🚫', text: 'Murtad', isBatal: true },
        { emoji: '👩‍❤️‍👨', text: 'Bersetubuh', isBatal: true },
        { emoji: '💦', text: 'Keluar Air Mani Sengaja', isBatal: true },
        { emoji: '😴', text: 'Tidur Seharian', isBatal: false },
        { emoji: '🚿', text: 'Mandi Sunat/Wajib', isBatal: false },
        { emoji: '🤷‍♂️', text: 'Makan Terlupa', isBatal: false }
    ];

    function initLevel() {
        player.x = window.innerWidth / 2;
        player.y = 100;
        player.vx = 0;
        player.vy = 0;
        score = 0;
        updateScoreUI();
        
        items = [];
        
        // Shuffle item data
        const shuffled = [...itemData].sort(() => Math.random() - 0.5);
        
        // Place items along the level (spacing them out)
        const spacing = levelWidth / (shuffled.length + 1);
        const dynamicGroundY = canvas.height - 150; // Tanah lebih tinggi sikit
        
        for(let i=0; i<shuffled.length; i++) {
            items.push({
                ...shuffled[i],
                x: (i+1) * spacing,
                y: dynamicGroundY - 180 - Math.random() * 80, // Pastikan boleh dicapai dengan lompatan
                radius: 45, // Besarkan hitbox objek
                collected: false,
                floatOffset: Math.random() * Math.PI * 2 // For floating animation
            });
        }
    }

    // --- Core Logic ---
    function update(dt) {
        if (gameState !== 'PLAYING') return;

        // Player Movement
        if (keys.right) {
            player.vx = player.speed;
            player.moveTimer += dt;
            if(player.grounded && player.moveTimer > 0.2) { playMoveSound(); player.moveTimer = 0; }
        } else {
            player.vx = 0;
        }

        if (keys.up && player.grounded) {
            player.vy = player.jumpForce;
            player.grounded = false;
            playJumpSound();
        }

        // Apply Gravity
        player.vy += player.gravity * dt;

        // Apply Velocity
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        // Ground Collision
        const dynamicGroundY = canvas.height - 150; // Ketinggian tanah baru
        
        // Kiraan mudah untuk bentuk zigzag tanah (anggaran perlanggaran)
        // Kita kekalkan perlanggaran rata supaya gameplay lancar, grafiknya sahaja zigzag
        if (player.y + player.radius > dynamicGroundY) {
            player.y = dynamicGroundY - player.radius;
            player.vy = 0;
            player.grounded = true;
        } else {
            player.grounded = false;
        }

        // Level Boundaries
        if (player.x < player.radius) player.x = player.radius;
        if (player.x > levelWidth) player.x = levelWidth;

        // Camera Follow
        cameraX = player.x - canvas.width / 2;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > levelWidth - canvas.width) cameraX = levelWidth - canvas.width;

        // Item Collision
        items.forEach(item => {
            if (!item.collected) {
                const dist = Math.hypot(player.x - item.x, player.y - item.y);
                if (dist < player.radius + item.radius) {
                    item.collected = true;
                    if (item.isBatal) {
                        score++;
                        playCorrectSound();
                    } else {
                        score--;
                        if(score < 0) score = 0; // Halang skor menjadi negatif
                        playWrongSound();
                    }
                    updateScoreUI();
                }
            }
        });

        // Tamat apabila pemain melepasi garisan penamat
        if (player.x >= levelWidth - 200) {
            endGame();
        }
    }

    function updateScoreUI() {
        document.getElementById('ui-score').innerText = score;
    }

    function endGame() {
        gameState = 'END';
        document.getElementById('ui-layer').classList.add('hidden');
        document.getElementById('controls').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `${score} / 7`;
        const title = document.getElementById('end-title');
        const message = document.getElementById('end-message');

        if (score >= 7) {
            title.innerText = "Syabas!";
            title.className = "text-4xl font-extrabold text-green-500 mb-2";
            message.innerText = `Tahniah ${playerName}! Anda berjaya menamatkan permainan dan mengenal pasti semua 7 perkara yang membatalkan puasa.`;
        } else {
            title.innerText = "Permainan Tamat!";
            title.className = "text-4xl font-extrabold text-blue-500 mb-2";
            message.innerText = `Tahniah ${playerName} kerana sampai ke garisan penamat. Anda mengumpul ${score} bintang. Cuba lagi untuk dapatkan markah penuh!`;
        }
    }

    // --- Rendering ---
    function draw() {
        // Clear Canvas
        ctx.fillStyle = '#65C2F5'; // Sky blue yang lebih terang seperti gambar
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameState !== 'PLAYING') return;

        ctx.save();
        ctx.translate(-cameraX, 0);

        const dynamicGroundY = canvas.height - 150;

        // Draw Scenery (Clouds & Hills)
        ctx.fillStyle = '#AEE2FF';
        for(let i=0; i<10; i++) {
            ctx.beginPath();
            ctx.arc((i * 1000) + (cameraX * 0.2), 200, 100, 0, Math.PI*2);
            ctx.arc((i * 1000) + 120 + (cameraX * 0.2), 200, 130, 0, Math.PI*2);
            ctx.arc((i * 1000) + 240 + (cameraX * 0.2), 200, 100, 0, Math.PI*2);
            ctx.fill();
        }

        // Draw Ground (Gaya Red Ball - Zig-Zag dengan border gelap)
        const zigZagWidth = 60;
        const zigZagHeight = 25;
        
        // Bayang/Border gelap bawah tanah
        ctx.fillStyle = '#519A21'; // Hijau gelap
        ctx.beginPath();
        ctx.moveTo(cameraX, dynamicGroundY);
        for(let x = cameraX - (cameraX % zigZagWidth) - zigZagWidth; x < cameraX + canvas.width + zigZagWidth; x += zigZagWidth) {
            ctx.lineTo(x + (zigZagWidth/2), dynamicGroundY - zigZagHeight);
            ctx.lineTo(x + zigZagWidth, dynamicGroundY);
        }
        ctx.lineTo(cameraX + canvas.width, canvas.height);
        ctx.lineTo(cameraX, canvas.height);
        ctx.fill();

        // Lukis Bendera Penamat
        ctx.fillStyle = '#cbd5e1'; // Tiang
        ctx.fillRect(levelWidth - 200, dynamicGroundY - 150, 10, 150);
        ctx.fillStyle = '#ef4444'; // Bendera Merah
        ctx.beginPath();
        ctx.moveTo(levelWidth - 190, dynamicGroundY - 150);
        ctx.lineTo(levelWidth - 120, dynamicGroundY - 120);
        ctx.lineTo(levelWidth - 190, dynamicGroundY - 90);
        ctx.fill();
        
        ctx.fillStyle = '#1f2937';
        ctx.font = 'bold 24px Inter';
        ctx.textAlign = 'center';
        ctx.fillText("TAMAT", levelWidth - 150, dynamicGroundY - 170);

        // Draw Items
        const time = performance.now() / 1000;
        items.forEach(item => {
            if (!item.collected) {
                // Float animation
                const floatY = item.y + Math.sin(time * 3 + item.floatOffset) * 15; // Apungan lebih jelas
                
                // Shadow objek
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(item.x, dynamicGroundY + 30, item.radius * 0.8, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Bubble Background
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.beginPath();
                ctx.arc(item.x, floatY, item.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = item.isBatal ? '#ef4444' : '#3b82f6'; // Merah jika batal, biru jika tidak
                ctx.stroke();

                // Emoji
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.emoji, item.x, floatY - 8);

                // Text Label
                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 15px Inter, sans-serif';
                
                // Wrapping text logic roughly
                const words = item.text.split(' ');
                if(words.length > 2) {
                    ctx.fillText(words.slice(0,2).join(' '), item.x, floatY + 32);
                    ctx.fillText(words.slice(2).join(' '), item.x, floatY + 48);
                } else if(words.length > 1) {
                    ctx.fillText(words[0], item.x, floatY + 32);
                    ctx.fillText(words.slice(1).join(' '), item.x, floatY + 48);
                } else {
                    ctx.fillText(item.text, item.x, floatY + 32);
                }
            }
        });

        // Draw Player (Red Bouncy Ball yang lebih 3D/Cantik)
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Putaran bola berdasarkan pergerakan (pilihan tambahan visual)
        ctx.rotate(player.x * 0.02);

        // Gradient untuk bentuk 3D bola
        const radGrad = ctx.createRadialGradient(
            -player.radius*0.4, -player.radius*0.4, player.radius*0.1,
            0, 0, player.radius
        );
        radGrad.addColorStop(0, '#ff9999'); // Pantulan cahaya (Highlight)
        radGrad.addColorStop(0.2, '#ff1a1a'); // Warna merah terang
        radGrad.addColorStop(0.8, '#cc0000'); // Merah gelap
        radGrad.addColorStop(1, '#660000');   // Bayang bawah

        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Sedikit border gelap untuk menyerlahkan bola
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#4d0000';
        ctx.stroke();

        ctx.restore();

        ctx.restore();
    }

    // --- Main Game Loop ---
    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = (timestamp - lastTime) / 1000; // Delta time in seconds
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // --- UI Interactions ---
    document.getElementById('start-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('player-name').value.trim();
        if(nameInput === '') {
            playerName = 'Pelajar';
        } else {
            playerName = nameInput;
        }
        
        document.getElementById('ui-name').innerText = playerName;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        
        // Show mobile controls if on touch device (naive check)
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('controls').classList.remove('hidden');
        }

        initAudio();
        initLevel();
        gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('ui-layer').classList.remove('hidden');
        
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('controls').classList.remove('hidden');
        }
        
        initLevel();
        gameState = 'PLAYING';
    });

    // Start Loop
    requestAnimationFrame(gameLoop);

</script>
</body>
</html>
